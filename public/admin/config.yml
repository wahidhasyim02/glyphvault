backend:
  name: github
  repo: wahidhasyim02/glyphvault
  branch: main

media_folder: "public/assets/icons"
public_folder: "/assets/icons"
favicon: favicon.svg

logo:
  src: favicon.svg
  show_in_header: true

collections:
  - name: "icons"
    label: "Icons"
    label_singular: "Icon"
    folder: "data/icons"
    create: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}} ({{category}})"
    sortable_fields: ["name", "category"]
    fields:
      - { label: "Icon Name", name: "name", widget: "string", hint: "Contoh: ambulance, bell, search (huruf kecil & tanda strip)" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Arrows & Chevrons"
          - "Communication & Social"
          - "Design & Tools"
          - "Development & Code"
          - "Devices & Hardware"
          - "E-Commerce & Finance"
          - "Emergency & Alerts"
          - "Files & Folders"
          - "General UI"
          - "Media & Audio"
          - "Security & System"
          - "Shapes & Badges"
          - "Time & Location"
          - "Weather & Nature"
      - { label: "Tags", name: "tags", widget: "list", default: ["glyph"] }
      - { label: "SVG Markup", name: "svg", widget: "text", hint: "Paste kode SVG langsung dari Figma" }
